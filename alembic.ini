# Alembic configuration — database migrations for the Expense Tracker API.
#
# The app runs `upgrade head` by itself on every start-up (see migrate.py),
# so on Render you don't need a separate migration step. Manual commands,
# run from this app/ folder:
#
#   alembic upgrade head                          apply all migrations
#   alembic current                               show the database's version
#   alembic history                               list migrations
#   alembic revision --autogenerate -m "message"  draft a new migration from models.py
#
# The database URL is NOT stored here: env.py reads DATABASE_URL (app/.env or
# the environment) through config.py, exactly like the app does.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
path_separator = os
